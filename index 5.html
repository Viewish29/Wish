<script>
'use strict';
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
const KEY='editable-iphone-studio-2026-v1', PEOPLE=[{id:'sion',name:'시온 오빠',short:'시온',emoji:'🐶',color:'#4f8df5',greeting:'오늘 학교 끝나면 뭐 해? 같이 밥 먹자 ㅎㅎ'},{id:'riku',name:'리쿠',short:'리쿠',emoji:'🐿️',color:'#e2b42b',greeting:'나 지금 도서관 앞인데 🥺 언제 와?'},{id:'yushi',name:'유우시',short:'유우시',emoji:'🐈',color:'#36b88c',greeting:'오늘도 학교 와? 잠깐 볼 수 있어?'}];
const S=[{id:'messages',name:'카카오톡'},{id:'instagram',name:'인스타그램'},{id:'photos',name:'사진'},{id:'calendar',name:'캘린더'},{id:'notes',name:'메모'},{id:'settings',name:'꾸미기'}];
const svg={messages:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fee500"/><path d="M32 13c-15 0-25 9-25 20 0 7 4 12 11 16l-2 9 12-7h4c16 0 26-8 26-19S47 13 32 13" fill="#351c20"/><text x="32" y="36" text-anchor="middle" font-size="10" font-family="Arial" font-weight="900" fill="#fee500">TALK</text></svg>`,instagram:`<svg viewBox="0 0 64 64"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#fcb045"/><stop offset=".5" stop-color="#fd1d74"/><stop offset="1" stop-color="#8338d3"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#ig)"/><rect x="13" y="13" width="38" height="38" rx="12" fill="none" stroke="white" stroke-width="5"/><circle cx="32" cy="32" r="9" fill="none" stroke="white" stroke-width="5"/><circle cx="44" cy="21" r="3.5" fill="white"/></svg>`,photos:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff"/>${['#ed5060','#f9a43b','#efd358','#82bf58','#4dcbb4','#589bc9','#9b73d0','#df80c5'].map((c,i)=>`<ellipse cx="32" cy="21" rx="9" ry="16" fill="${c}" opacity=".88" transform="rotate(${i*45} 32 32)"/>`).join('')}<circle cx="32" cy="32" r="6" fill="#fff"/></svg>`,calendar:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="white"/><text x="32" y="20" text-anchor="middle" font-size="13" fill="#f04f46" font-family="Arial">SUN</text><text x="32" y="51" text-anchor="middle" font-size="36" fill="#222" font-family="Arial">25</text></svg>`,notes:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff"/><rect y="0" width="64" height="22" fill="#ffd949"/><path d="M10 31h44M10 40h44M10 49h44" stroke="#b9b8b2" stroke-width="2"/></svg>`,settings:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#86858b"/><text x="32" y="46" font-size="43" text-anchor="middle" fill="white">⚙</text></svg>`};
const defaults=()=>({wallpaper:'',icons:{},profiles:{},auto:true,people:clone(PEOPLE),chats:Object.fromEntries(PEOPLE.map(p=>[p.id,[{sender:p.id,text:p.greeting,at:Date.now()-3600000}]])),photos:[],posts:PEOPLE.map((p,i)=>({id:'p'+i,author:p.id,caption:['수업 끝나고 잠깐 산책 ☀️','오늘 맛있는 거 먹었어 🍮','조용한 오후.'][i],image:'',emoji:['🌇','🍮','🌿'][i],liked:false})),stories:PEOPLE.map((p,i)=>({id:'s'+i,author:p.id,text:['오늘 날씨 좋다.','도서관 앞에서 기다리는 중 🥺','음악 듣는 중 🎧'][i],image:''})),events:[],notes:[{id:'n1',title:'오늘의 메모',body:'우리 셋과의 약속은 꼭 따로 확인하기 ♡'}]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){data=defaults()}for(const [k,v] of Object.entries(defaults()))if(data[k]===undefined)data[k]=v;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('브라우저 저장 공간이 부족해요. 사진 개수를 줄이거나 백업해 주세요.');return false}};
const node=(tag,cls='',txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};const btn=(txt,fn,cls='')=>{let b=node('button',cls,txt);b.onclick=fn;return b};const $all=s=>document.querySelectorAll(s);
let current='sion',photoFilter='전체',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),chosen=new Date(),currentScreen='lock';
function go(id){currentScreen=id;$all('.screen').forEach(e=>e.classList.toggle('active',e.id===id));$('phone').classList.toggle('darkStatus',id==='lock'||id==='home');if(id==='home')renderHome();if(id==='messages')renderMessages();if(id==='chat')renderChat();if(id==='photos')renderPhotos();if(id==='instagram')renderInstagram();if(id==='calendar')renderCalendar();if(id==='notes')renderNotes();if(id==='settings')renderSettings()}
$all('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));$('homeBar').onclick=()=>go('home');
function nowTime(){const d=new Date();const t=d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false});$('statusTime').textContent=t;$('lockTime').textContent=t;$('lockDate').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('todayNum').textContent=d.getDate()};nowTime();setInterval(nowTime,20000);
function iconFor(id){let div=node('div','appIcon');if(data.icons[id]){let img=node('img');img.src=data.icons[id];div.append(img)}else div.innerHTML=svg[id]||'📱';return div}
function appButton(a){let b=node('button','app');b.append(iconFor(a.id),node('span','appLabel',a.name));b.onclick=()=>go(a.id);return b}
function renderHome(){const grid=$('homeApps'),dock=$('dockApps');grid.replaceChildren(...S.map(appButton));dock.replaceChildren(...S.slice(0,4).map(appButton));$('phone').style.setProperty('--wallpaper',data.wallpaper?`url("${data.wallpaper}")`:'none');$all('.wall').forEach(e=>{if(data.wallpaper){e.style.backgroundImage=`linear-gradient(#0002,#0002),url("${data.wallpaper}")`}else e.style.backgroundImage=''});const today=key(new Date());$('widgetEvent').textContent=data.events.find(e=>e.date===today)?.title||'데이트 일정 확인';$('widgetNote').textContent=data.notes[0]?.title||'새 메모 작성'}
function person(id){return data.people.find(p=>p.id===id)||PEOPLE[0]};function avatar(id){let e=node('div','avatar');if(data.profiles[id]){let i=node('img');i.src=data.profiles[id];e.append(i)}else e.textContent=person(id).emoji;return e}
function renderMessages(){const box=$('chatList');box.replaceChildren(...data.people.map(p=>{let row=node('button','listRow');let copy=node('div');copy.append(node('div','name',p.name),node('div','preview',(data.chats[p.id]||[]).at(-1)?.text||'새 대화'));row.append(avatar(p.id),copy);row.onclick=()=>{current=p.id;go('chat')};return row}))}
function renderChat(){let p=person(current);$('chatTitle').textContent=p.name;const body=$('chatBody');body.replaceChildren(...(data.chats[current]||[]).map((m,i)=>{let row=node('div','msg'+(m.sender==='me'?' mine':''));if(m.sender!=='me')row.append(avatar(m.sender));let part=node('div');if(m.sender!=='me')part.append(node('div','who',person(m.sender).name));part.append(node('div','bubble',m.text));row.append(part,node('span','when',new Date(m.at||Date.now()).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})));return row}));body.scrollTop=body.scrollHeight}
const rules=[[/안녕|ㅎㅇ|하이/,['안녕 ㅎㅎ 오늘은 어땠어?','오오 왔어? 보고 싶었는데 🥺','응, 안녕. 뭐 하고 있었어?']],[/밥|먹|배고/,['아직이면 같이 먹자. 내가 맛있는 거 사줄게','나도 배고파 ㅠㅠ 같이 먹으러 가자','밥은 챙겨 먹어.']],[/도서관|과제|공부|수업/,['수업 끝나면 나한테 연락해. 기다릴게','도서관? 나도 지금 가도 돼? 🥺','공부 방해 안 할게. 끝나면 알려줘.']],[/보고 싶|만나|데이트/,['나도 보고 싶어. 언제 볼까?','진짜? 나 지금 바로 갈 수도 있는데ㅋㅋ','오늘 조금이라도 볼래?']],[/리쿠|시온|유우시|다른 남자|남자친구/,['걔랑 친해? ㅎㅎ 그냥 궁금해서','왜 걔 얘기해? 나도 같이 있고 싶은데','그 사람이랑 자주 만나?']],[/미안|죄송/,['아냐 괜찮아. 무슨 일 있었어?','왜 미안해 ㅠㅠ 나 삐진 거 아냐','괜찮아. 신경 쓰지 마.']],[/좋아해|사랑해/,['나도. 오늘은 좀 더 보고 싶네','헐 갑자기? ㅋㅋㅋ 나도 좋아해','나도. 진짜로.']],[/잘자|졸려|자러/,['푹 자. 내일 만나자 ♡','벌써 자? ㅠㅠ 그래 잘 자아','응, 잘 자. 내일 연락해.']]];
const extra={sion:['ㅋㅋㅋ 무슨 일이야? 자세히 말해봐','내일 점심 같이 먹자. 시간 돼?','걱정했잖아. 늦으면 연락해 줘','내가 데리러 갈까?'],riku:['뭐야아 ㅋㅋㅋ 너무 귀엽잖아','아 진짜 보고 싶다 🥺','나한테도 먼저 연락해 줘야 해!!','오늘 시간 있어? 잠깐이라도 보자'],yushi:['그랬구나. 괜찮아?','응. 조금 더 얘기해 줘','오늘 학교에서 봤던 것 같은데','나중에 조용히 둘이 보자']};
function reply(id,t){const pi=['sion','riku','yushi'].indexOf(id);for(const [rx,arr] of rules)if(rx.test(t))return arr[pi];let h=0;for(let i=0;i<t.length;i++)h+=t.charCodeAt(i)*(i+1);return extra[id][(h+(data.chats[id]||[]).length)%extra[id].length]}
$('sendForm').onsubmit=e=>{e.preventDefault();let input=$('chatInput'),t=input.value.trim();if(!t)return;const id=current;data.chats[id]??=[];data.chats[id].push({sender:'me',text:t,at:Date.now()});save();input.value='';renderChat();if(data.auto)setTimeout(()=>{data.chats[id].push({sender:id,text:reply(id,t),at:Date.now()});save();if(current===id&&currentScreen==='chat')renderChat()},650)};
function openSheet(title,render){$('sheetTitle').textContent=title;$('sheetBody').replaceChildren();$('sheetWrap').classList.add('open');render($('sheetBody'))}function closeSheet(){$('sheetWrap').classList.remove('open')};$('sheetClose').onclick=closeSheet;$('sheetWrap').onclick=e=>{if(e.target===$('sheetWrap'))closeSheet()};
function field(form,label,value='',type='text'){let wrap=node('label','');wrap.append(node('span','',label));let inp=node(type==='textarea'?'textarea':'input');if(type!=='textarea')inp.type=type;inp.value=value||'';wrap.append(inp);form.append(wrap);return inp}
function action(form,title,fn){form.append(btn(title,fn,'mainButton'))}
function imageInput(form,label,callback){let l=node('label');l.append(node('span','',label));let input=node('input');input.type='file';input.accept='image/*';input.onchange=async()=>{if(input.files[0]){try{callback(await shrink(input.files[0]));}catch(e){alert('사진을 처리하지 못했어요.')} }};l.append(input);form.append(l)}
function shrink(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{let img=new Image();img.onload=()=>{const max=850,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.75))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}
$('editPeople').onclick=()=>openSheet('채팅 상대 이름·사진 편집',box=>{const form=node('div','form');data.people.forEach(p=>{form.append(node('strong','',p.short));const name=field(form,'채팅에 표시할 이름',p.name);name.onchange=()=>{p.name=name.value;save();renderMessages()};imageInput(form,'프로필 사진 바꾸기',src=>{data.profiles[p.id]=src;save();renderMessages()})});box.append(form)});
$('chatEdit').onclick=()=>openSheet('대화 기록 편집',box=>{let form=node('div','form');const text=field(form,'메시지 내용','', 'textarea');const who=field(form,'보낸 사람 (me 또는 '+current+')',current);action(form,'대화에 추가',()=>{if(!text.value.trim())return;data.chats[current].push({sender:who.value==='me'?'me':current,text:text.value.trim(),at:Date.now()});save();closeSheet();renderChat()});action(form,'마지막 메시지 삭제',()=>{data.chats[current].pop();save();closeSheet();renderChat()});box.append(form)});
function renderPhotos(){let filters=['전체',...data.people.map(p=>p.short)];if(!filters.includes(photoFilter))photoFilter='전체';$('photoFilter').replaceChildren(...filters.map(f=>btn(f,()=>{photoFilter=f;renderPhotos()},f===photoFilter?'selected':'')));$('photoGrid').replaceChildren(...data.photos.filter(p=>photoFilter==='전체'||person(p.owner).short===photoFilter).map(p=>{let b=node('button','photoTile');if(p.image){let img=node('img');img.src=p.image;b.append(img)}else b.textContent='📷';b.onclick=()=>openSheet('사진 정보',area=>{const form=node('div','form');const cap=field(form,'설명',p.caption);action(form,'설명 저장',()=>{p.caption=cap.value;save();closeSheet()});form.append(btn('사진 삭제',()=>{if(confirm('사진을 삭제할까요?')){data.photos=data.photos.filter(x=>x!==p);save();closeSheet();renderPhotos()}},'danger'));area.append(form)});return b}))}
$('addPhoto').onclick=()=>openSheet('사진첩에 사진 추가',area=>{let form=node('div','form'),src='',caption=field(form,'사진 설명'),sel=node('select');data.people.forEach(p=>{let opt=node('option','',p.short);opt.value=p.id;sel.append(opt)});let l=node('label');l.append(node('span','','앨범'),sel);form.append(l);imageInput(form,'사진 선택',x=>src=x);action(form,'사진 저장',()=>{if(!src)return alert('사진을 먼저 선택해 줘.');data.photos.unshift({id:'ph'+Date.now(),owner:sel.value,caption:caption.value,image:src});if(save()){closeSheet();renderPhotos()}});area.append(form)});
function renderInstagram(){let stories=$('stories');stories.replaceChildren(...data.stories.map(s=>{let p=person(s.author),b=node('button','story'),ring=node('div','storyRing');ring.append(avatar(p.id));b.append(ring,node('span','',p.short));b.onclick=()=>openSheet(p.short+'의 스토리',area=>{if(s.image){let i=node('img');i.src=s.image;i.style='width:100%;border-radius:12px';area.append(i)}area.append(node('p','',s.text),btn('스토리 편집',()=>editStory(s),'mainButton'))});return b}));$('igFeed').replaceChildren(...data.posts.map(p=>{let author=person(p.author),card=node('article','instaFeed'),head=node('div','instaHead');head.append(avatar(author.id),node('span','',author.short),btn('수정',()=>editPost(p),'editorBtn'));let pic=node('div','instaPhoto');if(p.image){let im=node('img');im.src=p.image;pic.append(im)}else pic.textContent=p.emoji||'📷';let foot=node('div','instaFoot'),heart=btn(p.liked?'♥':'♡',()=>{p.liked=!p.liked;save();renderInstagram()});heart.style.color=p.liked?'#ee3566':'#242424';foot.append(heart,node('span','',p.liked?'좋아요 표시됨':''),node('p','',author.short+'  '+p.caption));card.append(head,pic,foot);return card}))}
function editPost(p){openSheet('게시물 편집',area=>{let form=node('div','form'),cap=field(form,'게시물 내용',p.caption,'textarea'),src=p.image||'';imageInput(form,'게시물 사진 변경',x=>src=x);action(form,'저장',()=>{p.caption=cap.value;p.image=src;save();closeSheet();renderInstagram()});form.append(btn('게시물 삭제',()=>{data.posts=data.posts.filter(x=>x!==p);save();closeSheet();renderInstagram()},'danger'));area.append(form)})}
$('addPost').onclick=()=>openSheet('새 게시물',area=>{let form=node('div','form'),sel=node('select');data.people.forEach(p=>{let o=node('option','',p.short);o.value=p.id;sel.append(o)});let l=node('label');l.append(node('span','','계정'),sel);form.append(l);let cap=field(form,'게시물 글','', 'textarea'),src='';imageInput(form,'게시물 사진',x=>src=x);action(form,'게시',()=>{data.posts.unshift({id:'p'+Date.now(),author:sel.value,caption:cap.value,image:src,emoji:'📷',liked:false});save();closeSheet();renderInstagram()});area.append(form)});
function editStory(s){openSheet('스토리 수정',area=>{let form=node('div','form'),text=field(form,'스토리 문구',s.text,'textarea'),src=s.image||'';imageInput(form,'스토리 사진',x=>src=x);action(form,'저장',()=>{s.text=text.value;s.image=src;save();closeSheet();renderInstagram()});area.append(form)})}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const calColors={sion:'#508bf7',riku:'#e8b52d',yushi:'#39bd8a'};
function renderCalendar(){$('calMonth').textContent=month.getFullYear()+'년 '+(month.getMonth()+1)+'월';$('weekdays').replaceChildren(...['월','화','수','목','금','토','일'].map(s=>node('span','',s)));const grid=$('calendarGrid');grid.replaceChildren();let off=(new Date(month.getFullYear(),month.getMonth(),1).getDay()+6)%7;for(let i=0;i<off;i++)grid.append(node('span'));let total=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let i=1;i<=total;i++){let date=new Date(month.getFullYear(),month.getMonth(),i),k=key(date),b=node('button','dateBox'+(key(chosen)===k?' current':'')),dots=node('span','dots');b.append(node('span','n',i));data.events.filter(e=>e.date===k).slice(0,3).forEach(e=>{let dot=node('i');dot.style.background=calColors[e.owner]||'#edb42f';dots.append(dot)});b.append(dots);b.onclick=()=>{chosen=date;renderCalendar()};grid.append(b)}$('calChosen').textContent=chosen.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('calEvents').replaceChildren(...(data.events.filter(e=>e.date===key(chosen)).map(e=>{let box=node('div','calEvent');box.style.borderLeftColor=calColors[e.owner]||'#e9b532';box.append(node('strong','',e.title),node('div','muted',e.time||''),btn('수정',()=>eventSheet(e),'editorBtn'));return box})));if(!$('calEvents').childNodes.length)$('calEvents').append(node('p','muted','등록된 일정이 없어.'))}
$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};$('addEvent').onclick=()=>eventSheet(null);
function eventSheet(e){openSheet(e?'일정 수정':'일정 추가',area=>{let form=node('div','form'),date=field(form,'날짜',e?.date||key(chosen),'date'),title=field(form,'일정 이름',e?.title||''),time=field(form,'시간',e?.time||'오후 3:00'),sel=node('select');data.people.forEach(p=>{let o=node('option','',p.short);o.value=p.id;sel.append(o)});sel.value=e?.owner||'sion';let l=node('label');l.append(node('span','','함께하는 사람'),sel);form.append(l);action(form,'저장',()=>{if(!title.value.trim()||!date.value)return alert('날짜와 제목을 입력해 줘.');if(!e){e={id:'e'+Date.now()};data.events.push(e)}Object.assign(e,{date:date.value,title:title.value.trim(),time:time.value,owner:sel.value});save();closeSheet();renderCalendar()});if(e)form.append(btn('일정 삭제',()=>{data.events=data.events.filter(x=>x!==e);save();closeSheet();renderCalendar()},'danger'));area.append(form)})}
function renderNotes(){$('noteList').replaceChildren(...data.notes.map(n=>{let b=node('button','note');b.append(node('strong','',n.title),node('div','muted',n.body.slice(0,80)));b.onclick=()=>noteSheet(n);return b}))};$('addNote').onclick=()=>noteSheet(null);
function noteSheet(n){openSheet(n?'메모 편집':'새 메모',area=>{let form=node('div','form'),title=field(form,'제목',n?.title||''),body=field(form,'내용',n?.body||'','textarea');action(form,'저장',()=>{if(!n){n={id:'n'+Date.now()};data.notes.unshift(n)}n.title=title.value;n.body=body.value;save();closeSheet();renderNotes()});if(n)form.append(btn('메모 삭제',()=>{data.notes=data.notes.filter(x=>x!==n);save();closeSheet();renderNotes()},'danger'));area.append(form)})}
function renderSettings(){const box=$('settingsItems');box.replaceChildren();const row=(label,action)=>{let r=node('div','settingsRow');r.append(node('span','',label),btn('변경',action));box.append(r)};row('아이폰 배경화면',()=>openSheet('배경화면 변경',area=>{let form=node('div','form');imageInput(form,'배경 이미지 선택',src=>{data.wallpaper=src;save();renderHome();closeSheet()});form.append(btn('기본 배경으로',()=>{data.wallpaper='';save();renderHome();closeSheet()},'danger'));area.append(form)}));S.forEach(app=>row(app.name+' 앱 아이콘',()=>openSheet(app.name+' 아이콘',area=>{let form=node('div','form');imageInput(form,'새 아이콘 이미지 선택',src=>{data.icons[app.id]=src;save();renderHome();closeSheet()});form.append(btn('기본 아이콘 사용',()=>{delete data.icons[app.id];save();renderHome();closeSheet()},'danger'));area.append(form)})));row('프로필 사진과 이름',()=>$('editPeople').click());let r=node('div','settingsRow'),span=node('span','','자동 답장 켜기'),cb=node('input');cb.type='checkbox';cb.checked=data.auto;cb.onchange=()=>{data.auto=cb.checked;save()};r.append(span,cb);box.append(r);row('인스타 스토리 내용 바꾸기',()=>openSheet('스토리 선택',area=>{data.stories.forEach(s=>area.append(btn(person(s.author).short+' 스토리 수정',()=>editStory(s),'mainButton')))}))}
$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='iphone-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('importData').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(!parsed.chats||!parsed.people||!Array.isArray(parsed.photos))throw Error();data=parsed;if(save()){alert('백업을 불러왔어요.');go('home')}}catch(err){alert('올바른 백업 파일이 아니에요.')}};
$('resetData').onclick=()=>{if(confirm('아이폰의 사진·메시지·메모 등 모든 저장 내용을 초기화할까요?')){data=defaults();save();go('home')}};
$('lock').addEventListener('touchstart',e=>{window._lockY=e.touches[0].clientY},{passive:true});$('lock').addEventListener('touchend',e=>{if(window._lockY-e.changedTouches[0].clientY>60)go('home')},{passive:true});
go('lock');
</script></body></html>
